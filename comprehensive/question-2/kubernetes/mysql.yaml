# WaitForFirstConsumer: an EBS volume can only be attached inside its own AZ.
# Binding it before the scheduler picks a node risks a volume in one AZ and a
# pod that has to run in another.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mysql-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
# The operator handles group replication, primary election and failover. Three
# instances is the smallest InnoDB Cluster that can still form a quorum after
# losing one AZ.
apiVersion: mysql.oracle.com/v2
kind: InnoDBCluster
metadata:
  name: asiayo-mysql
  namespace: asiayo
spec:
  # Created out of band, never committed:
  #   kubectl -n asiayo create secret generic asiayo-mysql-root \
  #     --from-literal=rootUser=root \
  #     --from-literal=rootHost=% \
  #     --from-literal=rootPassword=...
  secretName: asiayo-mysql-root
  tlsUseSelfSigned: true

  instances: 3
  router:
    instances: 2

  # One RWO PVC per instance. The instances do not share storage; replication
  # is what keeps the data available, not a shared volume.
  datadirVolumeClaimTemplate:
    storageClassName: mysql-gp3
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi

  podSpec:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            mysql.oracle.com/cluster: asiayo-mysql
